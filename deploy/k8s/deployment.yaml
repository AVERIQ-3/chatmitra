apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatmitra-app
  namespace: default
  labels:
    app: chatmitra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatmitra
  template:
    metadata:
      labels:
        app: chatmitra
    spec:
      containers:
        - name: app
          image: chatmitra-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: chatmitra-config
            - secretRef:
                name: chatmitra-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
