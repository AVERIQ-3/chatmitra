apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatmitra-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Enable WebSocket support for real-time messaging
    nginx.ingress.kubernetes.io/websocket-services: "chatmitra-service"
spec:
  rules:
    - host: chatmitra.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatmitra-service
                port:
                  number: 80
