apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatmitra-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/your-chatmitra-repo.git'
    targetRevision: HEAD
    path: deploy/helm/chatmitra
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
